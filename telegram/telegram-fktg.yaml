name: "Telegram 垃圾 IP 替换（FKTG）"
description: "把 Telegram 已确认劣化的 DC IP 改写为同一数据中心内的正常 IP，解决一直转圈 / 消息不刷新"
author: "FKTG 社区（Repcz / sooyaaabo）；Egern 原生移植 by Minis"
homepage: "https://github.com/BOBOLAOSHIV587/Rules/tree/main/JS/FuckTelegram"
icon: "paperplane.fill"

# ─────────────────────────────────────────────────────────────
# 原理
# Telegram 客户端不走 DNS，直接拿 help.getConfig 下发的 DC IP 建 TCP 连接，
# 所以改不了它的 DNS，只能在本机把「目标 IP」重写掉。
# Egern 的 dns.hosts 支持用 IP 字面量做 key，命中后返回另一组 IP，
# 这就是 Surge 里 [Host] + use-local-host-item-for-proxy 的同款能力。
#
# 铁律：只能在同一个 DC 内部换 IP。跨 DC 会被 Telegram 当成错误节点，
# 表现为一直 connecting 或不停重连。
#   DC1 149.154.175.50    DC2 149.154.167.51 / 95.161.76.100
#   DC3 149.154.175.100   DC4 149.154.167.91
#   DC5 91.108.56.100   ← +86 号码基本都在这
# ─────────────────────────────────────────────────────────────

dns:
  hosts:
    # ══ DC5（新加坡，+86 账号默认）══
    # 社区实测的劣化 IP → 同 DC 三个正常 IP（客户端会自己挑一个）
    "91.108.56.100": ["91.108.56.147", "91.108.56.135", "91.108.56.130"]
    "91.108.56.101": ["91.108.56.147", "91.108.56.135", "91.108.56.130"]
    "91.108.56.104": ["91.108.56.147", "91.108.56.135", "91.108.56.130"]
    "91.108.56.107": ["91.108.56.147", "91.108.56.135", "91.108.56.130"]
    "91.108.56.120": ["91.108.56.147", "91.108.56.135", "91.108.56.130"]
    "91.108.56.125": ["91.108.56.147", "91.108.56.135", "91.108.56.130"]
    "91.108.56.126": ["91.108.56.147", "91.108.56.135", "91.108.56.130"]
    "91.108.56.128": ["91.108.56.147", "91.108.56.135", "91.108.56.130"]
    "91.108.56.156": ["91.108.56.147", "91.108.56.135", "91.108.56.130"]

    # ══ DC2（欧洲）══
    # 95.161.76.100/31 是经典的「转圈 IP」，换回 DC2 主地址
    "95.161.76.100": ["149.154.167.51"]
    "95.161.76.101": ["149.154.167.51"]

    # ══ 下面这些先留空，转圈时再按需打开 ══
    # DC4：149.154.167.91 为主地址，备用 .92 / .93
    # "149.154.167.92": ["149.154.167.91"]
    # "149.154.167.93": ["149.154.167.91"]
    # DC1：149.154.175.50 为主地址，备用 .51 / .53 / .54 / .55
    # "149.154.175.51": ["149.154.175.50"]
    # DC3：149.154.175.100 为主地址，备用 .101 / .102 / .103
    # "149.154.175.101": ["149.154.175.100"]
